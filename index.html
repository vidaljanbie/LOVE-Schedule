<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Love Schedule ❤️</title>
<style>
*{box-sizing:border-box}
:root{--pink:#ff3f83;--pink2:#ff79a5;--soft:#fff0f6;--ink:#4d4d58;--muted:#8a8a95;--line:#f1dfe7;--shadow:0 12px 35px rgba(222,71,125,.13)}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#ffeaf2,#fff8fb 55%,#ffeaf2);color:var(--ink);min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.app{max-width:760px;margin:auto;background:rgba(255,255,255,.78);min-height:100vh;padding-bottom:94px;backdrop-filter:blur(8px)}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#ff3f83,#ff78a5);color:white;text-align:center;padding:34px 20px 30px;border-radius:0 0 42px 42px;box-shadow:0 12px 30px rgba(255,63,131,.18)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:#fff2;pointer-events:none}
.hero:before{width:180px;height:180px;right:-80px;top:-90px}.hero:after{width:130px;height:130px;left:-70px;bottom:-70px}
.hero .heart{font-size:54px;line-height:1;position:relative;z-index:1}.hero h1{margin:8px 0 4px;font-size:clamp(31px,8vw,44px);letter-spacing:-1px;position:relative;z-index:1}.hero p{font-size:18px;margin:8px 0;position:relative;z-index:1}
.card{background:rgba(255,255,255,.96);margin:18px 14px;padding:22px;border-radius:28px;box-shadow:var(--shadow);border:1px solid #fff}
h2{color:#e83d78;margin:0 0 16px;font-size:25px}.muted{color:var(--muted)}
label{display:block;font-weight:750;margin:14px 0 7px}
input,select,textarea{width:100%;padding:15px 16px;border:2px solid #eee;border-radius:18px;background:#fff;outline:none;color:var(--ink);transition:.2s}
input:focus,select:focus,textarea:focus{border-color:#ff5a91;box-shadow:0 0 0 4px #ff5a9118}
textarea{min-height:110px;resize:vertical}
.btn{width:100%;padding:15px 17px;border-radius:18px;background:linear-gradient(135deg,var(--pink),#ff5b94);color:#fff;font-weight:800;margin-top:12px;box-shadow:0 7px 18px rgba(255,63,131,.18);transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.985)}.btn.secondary{background:#fff0f6;color:#e83d78;box-shadow:none}.btn.dark{background:#45454b}.btn.gray{background:#eee;color:#555;box-shadow:none}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.tabs{display:flex;background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10}
.tab{flex:1;padding:16px 4px;background:#fff;color:#777;font-weight:bold}.tab.active{color:#f23f7e;border-bottom:3px solid #f23f7e}
.hidden{display:none!important}
.notice{padding:14px 15px;border-radius:17px;background:#fff3f7;color:#d83e72;margin:10px 0;border:1px solid #ffd8e6}
.code{font-size:clamp(22px,7vw,30px);font-weight:900;letter-spacing:3px;text-align:center;color:#ff4b87;background:#fff1f6;padding:18px 10px;border-radius:20px;word-break:break-all}
.avatar{width:100px;height:100px;border-radius:50%;object-fit:cover;background:#ffe2ed;display:block;margin:8px auto;border:4px solid #ff70a0;box-shadow:0 8px 20px #ff5b9430}
.avatar.small{width:58px;height:58px;margin:0}
.profile-top{text-align:center}
.item{padding:15px;border:1px solid #f3dce5;border-radius:19px;margin:10px 0;background:#fffafd}
.item strong{color:#e83d78}.danger{color:#d22}
.chat{height:430px;overflow:auto;background:linear-gradient(180deg,#fff8fb,#fff);padding:14px;border-radius:20px;border:1px solid #f7dce7}
.msg{max-width:82%;padding:11px 14px;border-radius:18px;margin:8px 0;clear:both;box-shadow:0 2px 8px #00000008;word-wrap:break-word}
.mine{float:right;background:linear-gradient(135deg,#ff4384,#ff679b);color:white;border-bottom-right-radius:5px}.theirs{float:left;background:#f0f0f3;border-bottom-left-radius:5px}.clear{clear:both}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:760px;width:100%;display:flex;background:rgba(255,255,255,.96);border-top:1px solid #eee;z-index:20;box-shadow:0 -8px 25px #d85a8414;backdrop-filter:blur(12px)}
.bottom button{flex:1;padding:9px 2px 10px;background:transparent;color:#777;font-size:11px;position:relative;transition:.2s}.bottom button.active{color:#ef4380;font-weight:900}.bottom button:active{transform:scale(.95)}
.unread-badge{position:absolute;top:0;right:7px;min-width:21px;height:21px;padding:0 5px;border-radius:999px;background:#ef2f55;color:#fff;font-size:12px;font-weight:900;line-height:21px;text-align:center;box-shadow:0 3px 9px #c51f4555}
.unread-badge.hidden{display:none}
.auth{min-height:100vh;background:linear-gradient(180deg,#ffe8f1,#fff8fb);padding:22px 12px}.auth .card{max-width:570px;margin:18px auto}
.auth-toggle{display:flex;background:#fff1f5;border-radius:19px;padding:5px}.auth-toggle button{flex:1;padding:14px;background:transparent;color:#ef4380;border-radius:15px;font-weight:bold}.auth-toggle .on{background:#ff4b87;color:#fff;box-shadow:0 6px 15px #ff4b8733}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal-box{background:#fff;border-radius:25px;padding:23px;max-width:600px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 20px 60px #0003}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#303035;color:#fff;padding:13px 18px;border-radius:16px;z-index:100;max-width:92%;text-align:center;box-shadow:0 8px 30px #0004}
small{color:#888}hr{border:0;border-top:1px solid #eee;margin:18px 0}.link{color:#e83d78;text-decoration:underline;cursor:pointer}
.file-help{font-size:12px;color:#888;margin-top:7px}.loading{padding:25px;text-align:center;color:#e83d78;font-weight:800}
@media(max-width:480px){.card{margin:14px 10px;padding:18px}.bottom button{font-size:10px}.hero{padding-top:28px}.row{flex-direction:column}.chat{height:390px}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast hidden"></div>
<div id="offline" class="hidden" style="position:fixed;top:0;left:0;right:0;z-index:200;background:#333;color:#fff;text-align:center;padding:8px;font-size:13px">No internet connection. Firebase features need internet.</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendPasswordResetEmail,signOut,updateProfile,deleteUser,reauthenticateWithCredential,EmailAuthProvider} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,addDoc,collection,query,orderBy,onSnapshot,serverTimestamp,runTransaction,deleteDoc,arrayUnion} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyASwNmo1wP5v78YDmHl5iKC9hWMQZ-DIMA",
 authDomain:"love-schedule.firebaseapp.com",
 projectId:"love-schedule",
 storageBucket:"love-schedule.firebasestorage.app",
 messagingSenderId:"75154379421",
 appId:"1:75154379421:web:891decd42ef3d70dcdfa74",
 measurementId:"G-V9PVKS22TG"
};

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let me=null,userData=null,partnerData=null,unsubs=[],active="home",unreadUnsub=null,messengerOpen=false,markingSeen=false;

function networkState(){
  const el=$("offline");
  if(el)el.classList.toggle("hidden",navigator.onLine);
}
window.addEventListener("online",networkState);
window.addEventListener("offline",networkState);
setTimeout(networkState,0);

const $=id=>document.getElementById(id);
function toast(s){$("toast").textContent=s;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),3200)}
function err(e){
 const c=e?.code||"";
 const map={
  "auth/email-already-in-use":"Email is already registered.",
  "auth/invalid-email":"Invalid email address.",
  "auth/weak-password":"Password must be at least 6 characters.",
  "auth/invalid-credential":"Incorrect email or password.",
  "auth/user-not-found":"Account not found.",
  "auth/wrong-password":"Incorrect password.",
  "auth/too-many-requests":"Too many attempts. Try again later.",
  "auth/network-request-failed":"Network error. Check your internet connection.",
  "auth/requires-recent-login":"Please log in again before deleting the account.",
  "auth/wrong-password":"Incorrect password.",
  "permission-denied":"Firebase permission denied. Check your Firestore Rules.",
  "failed-precondition":"Firebase is not fully configured yet.",
  "already-exists":"This data already exists.",
  "unavailable":"No internet connection."
 };
 return map[c]||map[c.replace("firebase/","")]||e?.message||"Something went wrong.";
}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function dateAge(b){
 const d=new Date(b+"T00:00:00"),now=new Date();
 let age=now.getFullYear()-d.getFullYear();
 const m=now.getMonth()-d.getMonth();
 if(m<0||(m===0&&now.getDate()<d.getDate()))age--;
 return age;
}
function validBirthday(b){if(!b)return false;const d=new Date(b+"T00:00:00");return d<=new Date() && dateAge(b)>=16}
function remembered(){
 try{return JSON.parse(localStorage.getItem("loveScheduleAccounts")||"[]")}catch{return[]}
}
function remember(email){
 let a=remembered().filter(x=>x!==email);a.unshift(email);localStorage.setItem("loveScheduleAccounts",JSON.stringify(a.slice(0,5)));
}
function clearUnsubs(){unsubs.forEach(f=>f&&f());unsubs=[]}
function img(url,small=false){
  const safe=typeof url==="string" && (url.startsWith("data:image/") || url.startsWith("https://"));
  return safe?`<img class="avatar ${small?"small":""}" src="${esc(url)}" alt="Profile" loading="lazy">`:`<div class="avatar ${small?"small":""}" style="display:flex;align-items:center;justify-content:center;font-size:38px">👤</div>`
}

function authPage(mode="login"){
 const a=remembered();
 $("root").innerHTML=`<div class="auth"><div class="hero"><div class="heart">💕</div><h1>Love Schedule</h1><p>Plan your special moments together ❤️</p></div>
 <div class="card">
 <div class="auth-toggle"><button id="loginTab" class="${mode==="login"?"on":""}">Login</button><button id="signupTab" class="${mode==="signup"?"on":""}">Sign Up</button></div>
 <div id="authForm"></div>
 </div></div>`;
 $("loginTab").onclick=()=>authPage("login");$("signupTab").onclick=()=>authPage("signup");renderAuthForm(mode,a);
}
function renderAuthForm(mode,a){
 if(mode==="login"){
  $("authForm").innerHTML=`<label>Email</label><input id="email" type="email" placeholder="your@email.com" value="${esc(a[0]||"")}">
  <label>Password</label><input id="password" type="password" placeholder="Password">
  <button class="btn" id="loginBtn">❤️ Login</button>
  <button class="btn secondary" id="forgotBtn">Forgot Password?</button>
  ${a.length?`<hr><b>Accounts on this device</b>${a.map(e=>`<button class="btn gray accountBtn" data-e="${esc(e)}">${esc(e)}</button>`).join("")}`:""}`;
  $("loginBtn").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);remember($("email").value.trim())}catch(e){toast(err(e))}};
  $("forgotBtn").onclick=async()=>{const e=$("email").value.trim();if(!e)return toast("Enter your email first.");try{await sendPasswordResetEmail(auth,e);toast("Password reset email sent. Check your inbox.")}catch(x){toast(err(x))}};
  document.querySelectorAll(".accountBtn").forEach(b=>b.onclick=()=>{$("email").value=b.dataset.e});
 }else{
  $("authForm").innerHTML=`<label>Full Name</label><input id="name" placeholder="Your full name">
  <label>Username</label><input id="username" placeholder="@username">
  <label>Birthday</label><input id="birthday" type="date">
  <small>Users must be 16 years old or older.</small>
  <label>Gender</label><select id="gender"><option value="">Choose gender</option><option>Male</option><option>Female</option></select>
  <label>Address</label><input id="address" placeholder="Your address">
  <label>Email</label><input id="email" type="email" placeholder="your@email.com">
  <label>Password</label><input id="password" type="password" placeholder="At least 6 characters">
  <label>Confirm Password</label><input id="confirm" type="password" placeholder="Repeat password">
  <label><input id="terms" type="checkbox" style="width:auto"> I agree to the <span class="link" id="termsLink">Terms of Use</span> and <span class="link" id="privacyLink">Privacy Policy</span>.</label>
  <button class="btn" id="signupBtn">💕 Create Account</button>`;
  $("termsLink").onclick=()=>policy("Terms of Use");$("privacyLink").onclick=()=>policy("Privacy Policy");
  $("signupBtn").onclick=signup;
 }
}
async function signup(){
 const name=$("name").value.trim(),username=$("username").value.trim().replace(/^@/,""),birthday=$("birthday").value,gender=$("gender").value,address=$("address").value.trim(),email=$("email").value.trim(),p=$("password").value,c=$("confirm").value;
 if(!name||!username||!birthday||!gender||!address||!email||!p)return toast("Please complete all fields.");
 if(!validBirthday(birthday))return toast("Sorry, users under 16 cannot use Love Schedule.");
 if(p.length<6||p!==c)return toast("Check your passwords. They must match and be at least 6 characters.");
 if(!$("terms").checked)return toast("Please accept the Terms and Privacy Policy.");
 try{
  const cred=await createUserWithEmailAndPassword(auth,email,p);me=cred.user;
  await updateProfile(me,{displayName:name});
  let code="",ok=false;
  for(let i=0;i<8&&!ok;i++){
   code="LOVE-"+Math.random().toString(36).slice(2,8).toUpperCase();
   try{await runTransaction(db,async tx=>{const r=doc(db,"coupleCodes",code);const s=await tx.get(r);if(s.exists())throw new Error("COLLISION");tx.set(r,{ownerUid:me.uid,ownerEmail:email,coupleId:null,createdAt:serverTimestamp()})});ok=true}catch(e){if(e.message!=="COLLISION")throw e}
  }
  if(!ok)throw new Error("Could not generate a unique couple code.");
  await setDoc(doc(db,"users",me.uid),{uid:me.uid,name,username,birthday,gender,address,email,photoURL:"",coupleId:null,partnerUid:null,coupleCode:code,createdAt:serverTimestamp()});
  remember(email);toast("Account created! ❤️");
 }catch(e){toast(err(e))}
}
onAuthStateChanged(auth,async u=>{
 clearUnsubs();me=u;
 if(!u){authPage("login");return}
 remember(u.email||"");
 try{
  const ref=doc(db,"users",u.uid);
  const s=await getDoc(ref);

  // IMPORTANT: Never sign the user out just because the Firestore profile
  // is missing. Older accounts can have Firebase Authentication data but
  // no /users/{uid} document. In that case we repair the account in-app.
  if(!s.exists()){
    repairProfilePage(u);
    return;
  }

  userData=s.data();

  // Older/incomplete profiles may be missing fields. Ask the user to
  // complete the missing information instead of showing "Profile not found".
  const required=["name","username","birthday","gender","address","email"];
  const missing=required.some(k=>!userData[k]);
  if(missing || !userData.coupleCode){
    repairProfilePage(u,userData);
    return;
  }

  await loadPartner();appPage();
 }catch(e){
  console.error(e);
  toast(err(e));
 }
});

function repairProfilePage(u, existing={}){
  const birthday = existing.birthday || "";
  const gender = existing.gender || "";
  const name = existing.name || u.displayName || "";
  const username = existing.username || "";
  const address = existing.address || "";
  const email = existing.email || u.email || "";

  $("root").innerHTML=`<div class="auth">
    <div class="hero"><div class="heart">💕</div><h1>Love Schedule</h1>
      <p>Complete your profile to continue ❤️</p>
    </div>
    <div class="card">
      <h2>🔧 Complete / Repair Account</h2>
      <div class="notice">Your Firebase login is working, but your Love Schedule profile is incomplete. Your account was not deleted. Complete the information below and we will create/repair your profile.</div>

      <label>Full Name</label>
      <input id="repairName" value="${esc(name)}" placeholder="Your full name">

      <label>Username</label>
      <input id="repairUsername" value="${esc(username)}" placeholder="@username">

      <label>Birthday</label>
      <input id="repairBirthday" type="date" value="${esc(birthday)}">
      <small>Users must be 16 years old or older.</small>

      <label>Gender</label>
      <select id="repairGender">
        <option value="">Choose gender</option>
        <option ${gender==="Male"?"selected":""}>Male</option>
        <option ${gender==="Female"?"selected":""}>Female</option>
      </select>

      <label>Address</label>
      <input id="repairAddress" value="${esc(address)}" placeholder="Your address">

      <label>Email</label>
      <input id="repairEmail" value="${esc(email)}" disabled>

      <button class="btn" id="repairBtn">❤️ Save & Continue</button>
      <button class="btn secondary" id="repairLogout">Logout</button>
    </div>
  </div>`;

  $("repairBtn").onclick=()=>finishRepairProfile(u,existing);
  $("repairLogout").onclick=()=>signOut(auth);
}

async function generateUniqueCoupleCode(){
  for(let i=0;i<12;i++){
    const code="LOVE-"+Math.random().toString(36).slice(2,8).toUpperCase();
    const ref=doc(db,"coupleCodes",code);
    try{
      const ok=await runTransaction(db,async tx=>{
        const snap=await tx.get(ref);
        if(snap.exists()) return false;
        tx.set(ref,{
          ownerUid:me.uid,
          ownerEmail:me.email||"",
          coupleId:null,
          createdAt:serverTimestamp()
        });
        return true;
      });
      if(ok) return code;
    }catch(e){
      // Retry only for a collision/transaction conflict. Other errors
      // are surfaced to the user.
      if(e?.code==="permission-denied") throw e;
    }
  }
  throw new Error("Could not create a unique Couple Code. Please try again.");
}

async function finishRepairProfile(u,existing={}){
  const name=$("repairName").value.trim();
  const username=$("repairUsername").value.trim().replace(/^@/,"");
  const birthday=$("repairBirthday").value;
  const gender=$("repairGender").value;
  const address=$("repairAddress").value.trim();

  if(!name||!username||!birthday||!gender||!address)
    return toast("Please complete all fields.");
  if(!validBirthday(birthday))
    return toast("Sorry, users under 16 cannot use Love Schedule.");

  try{
    let code=existing.coupleCode||"";

    // If this is the broken account that has no profile document, create
    // the missing profile and a unique Couple Code.
    if(!code){
      code=await generateUniqueCoupleCode();
    }

    const data={
      uid:u.uid,
      name,
      username,
      birthday,
      gender,
      address,
      email:u.email||existing.email||"",
      photoURL:existing.photoURL||"",
      coupleId:existing.coupleId||null,
      partnerUid:existing.partnerUid||null,
      coupleCode:code,
      createdAt:existing.createdAt||serverTimestamp()
    };

    const ref=doc(db,"users",u.uid);

    if(Object.keys(existing).length===0){
      await setDoc(ref,data);
    }else{
      // Existing incomplete profile: update only fields permitted by the
      // recommended rules below. If coupleCode is missing, the recommended
      // rules allow it as well.
      await setDoc(ref,data,{merge:true});
    }

    await updateProfile(u,{displayName:name});
    userData=(await getDoc(ref)).data();
    await loadPartner();
    toast("Account repaired successfully! ❤️");
    appPage();
  }catch(e){
    console.error(e);
    toast(err(e));
  }
}

async function loadPartner(){
 partnerData=null;
 if(userData?.partnerUid){const s=await getDoc(doc(db,"users",userData.partnerUid));if(s.exists())partnerData=s.data()}
}

function updateUnreadBadge(count){
 const b=$("unreadBadge");
 if(!b)return;
 if(count>0){
  b.textContent=count>99?"99+":String(count);
  b.classList.remove("hidden");
 }else{
  b.classList.add("hidden");
 }
}

function startUnreadListener(){
 if(unreadUnsub){unreadUnsub();unreadUnsub=null;}
 updateUnreadBadge(0);
 if(!userData?.coupleId)return;
 const q=query(collection(db,"couples",userData.coupleId,"messages"),orderBy("createdAt","asc"));
 unreadUnsub=onSnapshot(q,snap=>{
   let count=0;
   snap.forEach(d=>{
     const x=d.data();
     const readBy=Array.isArray(x.readBy)?x.readBy:[];
     if(x.senderUid!==me.uid && !readBy.includes(me.uid)) count++;
   });
   // While Messenger is open, incoming messages are immediately treated as seen.
   updateUnreadBadge(messengerOpen ? 0 : count);
   if(messengerOpen && count>0 && !markingSeen) markMessagesSeen();
 },e=>console.warn("Unread listener:",e));
}

async function markMessagesSeen(){
 if(!userData?.coupleId || markingSeen)return;
 markingSeen=true;
 try{
   const q=query(collection(db,"couples",userData.coupleId,"messages"),orderBy("createdAt","asc"));
   const snap=await new Promise((resolve,reject)=>{
     let stop=()=>{};
     stop=onSnapshot(q,s=>{stop();resolve(s)},e=>{stop();reject(e)});
   });
   const jobs=[];
   snap.forEach(d=>{
     const x=d.data();
     const readBy=Array.isArray(x.readBy)?x.readBy:[];
     if(x.senderUid!==me.uid && !readBy.includes(me.uid)){
       // arrayUnion prevents duplicate UIDs and avoids overwriting another user's seen state.
       jobs.push(updateDoc(d.ref,{readBy:arrayUnion(me.uid)}));
     }
   });
   if(jobs.length)await Promise.all(jobs);
   updateUnreadBadge(0);
 }catch(e){console.warn("Could not mark messages as seen:",e);}
 finally{markingSeen=false;}
}

function appPage(){
 $("root").innerHTML=`<div class="app">
 <div class="hero"><div class="heart">💕</div><h1>Love Schedule</h1><p>Plan your special moments together ❤️</p></div>
 <main id="main"></main>
 <div class="bottom">
 <button data-tab="home">🏠<br>Home</button><button data-tab="schedule">📅<br>Schedule</button><button data-tab="partner">💑<br>Partner</button><button data-tab="messenger" id="messengerNav">💬<span id="unreadBadge" class="unread-badge hidden">0</span><br>Messenger</button><button data-tab="history">📖<br>History</button><button data-tab="profile">👤<br>Profile</button>
 </div></div>`;
 document.querySelectorAll(".bottom button").forEach(b=>b.onclick=()=>{active=b.dataset.tab;render()});startUnreadListener();render();
}
async function render(){
 document.querySelectorAll(".bottom button").forEach(b=>b.classList.toggle("active",b.dataset.tab===active));
 messengerOpen=(active==="messenger");
 if(!messengerOpen){} else updateUnreadBadge(0);

async function connectPartner(){
 const code=$("partnerCode").value.trim().toUpperCase();
 if(!/^LOVE-[A-Z0-9]{6}$/.test(code))return toast("Enter a valid Couple Code.");
 if(userData.partnerUid)return toast("You are already connected to a partner.");

 try{
  const cs=await getDoc(doc(db,"coupleCodes",code));
  if(!cs.exists())return toast("Couple Code not found.");

  const c=cs.data();
  if(c.ownerUid===me.uid)return toast("You cannot connect your own code.");
  if(c.coupleId)return toast("That Couple Code is already connected.");

  // Do NOT read the other user's private profile before the couple is
  // connected. Firestore rules intentionally protect unconnected profiles.
  // The rules verify that the entered code belongs to the other account.
  const partnerRef=doc(db,"users",c.ownerUid);
  const coupleId=[me.uid,c.ownerUid].sort().join("_");

  await setDoc(doc(db,"couples",coupleId),{
    members:[me.uid,c.ownerUid],
    createdAt:serverTimestamp()
  });

  await updateDoc(doc(db,"coupleCodes",code),{coupleId});
  await updateDoc(doc(db,"users",me.uid),{coupleId,partnerUid:c.ownerUid});
  await updateDoc(partnerRef,{coupleId,partnerUid:me.uid});

  userData=(await getDoc(doc(db,"users",me.uid))).data();
  await loadPartner();
  await addHistory("Partner connected");
  toast("Partner connected! ❤️");
  render();
 }catch(e){toast(err(e))}
}

async function deleteAccount(){
 const ok=confirm("Delete your Love Schedule account permanently? Your profile, Couple Code and connection will be removed. This cannot be undone.");
 if(!ok)return;
 const password=prompt("For security, enter your current account password to confirm deletion:");
 if(password===null)return;
 if(!password)return toast("Password is required to delete the account.");
 try{
  // Firebase requires recent authentication for account deletion.
  const credential=EmailAuthProvider.credential(me.email,password);
  await reauthenticateWithCredential(me,credential);

  const current=(await getDoc(doc(db,"users",me.uid))).data()||{};
  const partnerUid=current.partnerUid||null;
  const coupleId=current.coupleId||null;
  const coupleCode=current.coupleCode||null;

  // Disconnect the partner so they can connect to a new account later.
  if(partnerUid){
   try{
    const partnerSnap=await getDoc(doc(db,"users",partnerUid));
    const partner=partnerSnap.exists()?partnerSnap.data():{};
    await updateDoc(doc(db,"users",partnerUid),{coupleId:null,partnerUid:null});

    // Free the remaining partner's Couple Code for a future connection.
    if(partner.coupleCode){
     await updateDoc(doc(db,"coupleCodes",partner.coupleCode),{coupleId:null}).catch(()=>{});
    }

    // Keep shared history for the remaining partner, but remove the deleted UID.
    if(coupleId){
     await updateDoc(doc(db,"couples",coupleId),{members:[partnerUid]}).catch(()=>{});
    }
   }catch(e){console.warn("Partner disconnect cleanup skipped",e)}
  }

  if(coupleCode){
   try{await deleteDoc(doc(db,"coupleCodes",coupleCode));}catch(e){console.warn("Couple code cleanup skipped",e)}
  }

  // Remove this user's Firestore profile, then remove Firebase Authentication.
  await deleteDoc(doc(db,"users",me.uid));
  try{localStorage.setItem("loveScheduleAccounts",JSON.stringify(remembered().filter(x=>x!==me.email)));}catch{}
  await deleteUser(me);

  me=null;userData=null;partnerData=null;clearUnsubs();
  toast("Account deleted successfully.");
  setTimeout(()=>authPage("login"),500);
 }catch(e){
  console.error("DELETE ACCOUNT ERROR:",e);
  if(e?.code==="auth/invalid-credential"||e?.code==="auth/wrong-password")return toast("Incorrect password. Account was not deleted.");
  if(e?.code==="auth/requires-recent-login")return toast("Please log in again, then try Delete Account.");
  if(e?.code==="permission-denied")return toast("Delete permission denied. Update the Firestore Rules from the V6 instructions.");
  toast("Account deletion failed: "+(e?.message||"Unknown error"));
 }
}

async function imageFileToDataURL(file){
  if(!file)return "";
  if(!file.type || !file.type.startsWith("image/"))throw new Error("Please choose an image file.");
  // FileReader is intentionally used instead of createImageBitmap/object URLs.
  // This is more compatible with Android browsers and Acode WebView file pickers.
  const raw=await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(new Error("The selected image could not be read by this browser."));
    reader.onabort=()=>reject(new Error("Image reading was canceled."));
    reader.readAsDataURL(file);
  });
  const image=await new Promise((resolve,reject)=>{
    const im=new Image();
    im.onload=()=>resolve(im);
    im.onerror=()=>reject(new Error("The selected file is not a readable image."));
    im.src=raw;
  });

  const maxSide=720;
  let w=image.naturalWidth||image.width,h=image.naturalHeight||image.height;
  if(!w||!h)throw new Error("Could not determine the image size.");
  const scale=Math.min(1,maxSide/Math.max(w,h));
  w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));

  const canvas=document.createElement("canvas");
  canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext("2d",{alpha:false});
  if(!ctx)throw new Error("Your browser cannot process this image.");
  ctx.fillStyle="#ffffff";ctx.fillRect(0,0,w,h);ctx.drawImage(image,0,0,w,h);

  // Keep the Firestore document comfortably below its 1 MiB limit.
  // Firestore documents have a 1 MiB maximum, so target a small data URL.
  let quality=.78,data=canvas.toDataURL("image/jpeg",quality);
  while(data.length>220000 && quality>.42){
    quality-=.06;
    data=canvas.toDataURL("image/jpeg",quality);
  }
  if(data.length>300000){
    const smaller=document.createElement("canvas");
    const ratio=.72;
    smaller.width=Math.max(1,Math.round(w*ratio));
    smaller.height=Math.max(1,Math.round(h*ratio));
    const c2=smaller.getContext("2d",{alpha:false});
    c2.fillStyle="#ffffff";c2.fillRect(0,0,smaller.width,smaller.height);c2.drawImage(image,0,0,smaller.width,smaller.height);
    data=c2.toDataURL("image/jpeg",.62);
  }
  if(data.length>500000)throw new Error("Photo is still too large after compression. Please choose another photo.");
  return data;
}

async function saveProfile(){
 const name=$("pName").value.trim();
 const username=$("pUsername").value.trim().replace(/^@/,"");
 const address=$("pAddress").value.trim();
 if(!name||!username||!address)return toast("Complete your profile.");
 const f=$("photoInput")?.files?.[0];
 try{
  const changes={name,username,address};
  if(f){
   if(f.size>25*1024*1024)return toast("Please choose a photo smaller than 25MB.");
   toast("Preparing your profile picture... ❤️");
   changes.photoURL=await imageFileToDataURL(f);
  }
  await updateDoc(doc(db,"users",me.uid),changes);
  await updateProfile(me,{displayName:name});
  userData=(await getDoc(doc(db,"users",me.uid))).data();
  toast("Profile saved successfully ❤️");
  render();
 }catch(e){
  console.error("SAVE PROFILE ERROR:",e);
  if(e?.code==="permission-denied")return toast("Firestore permission denied. Please publish the V9 Firestore Rules.");
  if(e?.code==="resource-exhausted")return toast("Photo is too large. Choose a smaller image.");
  toast("Save failed: "+(e?.message||"Unknown error"));
 }
}
